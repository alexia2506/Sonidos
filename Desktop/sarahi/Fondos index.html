<!DOCTYPE html>
<HTML>
<HEAD>
    <TITLE>Paisaje en Movimiento</TITLE>

    <STYLE>
        *{
            margin: 0;
            padding: 0;
        }

        body{
            overflow: hidden;
        }

        img{
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            position: absolute;
            animation: mover 8s infinite alternate;
        }

        @keyframes mover{
            from{
                transform: scale(1);
            }

            to{
                transform: scale(1.1);
            }
        }

        h1{
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 40px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }

        p{
            position: absolute;
            bottom: 20px;
            left: 20px;
            color: white;
            font-size: 25px;
            background: rgba(0,0,0,0.5);
            padding: 10px;
        }
    </STYLE>
</HEAD>

<BODY>

    <IMG src="https://images.unsplash.com/photo-1506744038136-46273834b3fb">

    <H1>Paisaje en Movimiento</H1>

    <P>Mi nombre es Alexia Sarahi Pérez Taboada</P>

</BODY>
</HTML>
